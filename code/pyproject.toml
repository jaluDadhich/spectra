[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectra"
version = "1.0.0"
description = "SPECTRA - Submission Pre-Bind Evidence Check and Truth Review Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.29,<1.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "openai>=1.30,<2.0",
    "jinja2>=3.1,<4.0",
    "httpx>=0.27,<1.0",
    "langgraph>=0.5.4,<1.0",
    "langgraph-checkpoint-sqlite>=2.0,<3.0",
    "openpyxl>=3.1,<4.0",
    "pymupdf>=1.24,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

[project.scripts]
spectra = "app.cli.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/*.md", "ui/templates/*.html", "ui/static/*.css", "ui/static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=120"
